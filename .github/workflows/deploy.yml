name: test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu-latest 가 Ubuntu 26 으로 바뀌어도 브라우저 의존성 설치가 깨지지 않게 고정
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps ${{ matrix.browser }}
      # tmux 상태 머신 단위 테스트 + 모든 레벨 답안 + 미션 150라운드를 실제 브라우저로 검증
      - run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
      # 영어 화면: 모든 레벨 + 화면에 한글이 남지 않았는지
      - run: npm run test:en
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.browser == 'chromium'
        with:
          path: dist

  # 같은 키 입력을 실제 Neovim 과 사이트 에디터에 넣고 결과(텍스트·커서·모드)가 같은지 비교
  nvim-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Neovim 0.11.0 설치 (로컬 비교 기준과 같은 버전)
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.0/nvim-linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: nvim --version | head -1
      - run: npm run test:nvim

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, nvim-diff]
    runs-on: ubuntu-24.04
    # Pages 배포 권한은 이 job 에만. test·nvim-diff 는 contents: read 만 받는다
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
